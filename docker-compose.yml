# ─────────────────────────────────────────────
#  Shared log rotation (all services)
# ─────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

# ─────────────────────────────────────────────
#  Shared defaults – DB-dependent services
# ─────────────────────────────────────────────
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - citymarket
  logging: *default-logging
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
    db-seed:
      condition: service_completed_successfully

# ─────────────────────────────────────────────
#  Shared defaults – DB + RabbitMQ services
# ─────────────────────────────────────────────
x-rabbitmq-service: &rabbitmq-service
  restart: unless-stopped
  networks:
    - citymarket
  logging: *default-logging
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
    db-seed:
      condition: service_completed_successfully

services:
  # ────────────────────────────────────────────
  #  Infrastructure
  # ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - citymarket
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER:-citymarket}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"

  db-init:
    image: mysql:8.0
    restart: "no"
    networks:
      - citymarket
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./docker/mysql/init-schemas.sh:/init-schemas.sh:ro
      - ./services/auth-service/src/infrastructure/database/schema.sql:/schemas/auth-service.sql:ro
      - ./services/user-service/src/infrastructure/database/schema.sql:/schemas/user-service.sql:ro
      - ./services/vendor-service/src/infrastructure/database/schema.sql:/schemas/vendor-service.sql:ro
      - ./services/catalog-service/src/infrastructure/database/schema.sql:/schemas/catalog-service.sql:ro
      - ./services/order-service/src/infrastructure/database/schema.sql:/schemas/order-service.sql:ro
      - ./services/delivery-service/src/infrastructure/database/schema.sql:/schemas/delivery-service.sql:ro
      - ./services/notification-service/src/infrastructure/database/schema.sql:/schemas/notification-service.sql:ro
      - ./services/payment-service/src/infrastructure/database/schema.sql:/schemas/payment-service.sql:ro
      - ./services/rating-service/src/infrastructure/database/schema.sql:/schemas/rating-service.sql:ro
    command: sh /init-schemas.sh

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    restart: "no"
    networks:
      - citymarket
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      # Placeholders for required vars validated at config load — not used during seeding
      JWT_ACCESS_SECRET: seed-placeholder
      JWT_REFRESH_SECRET: seed-placeholder
      JWT_SERVICE_ACCESS_SECRET: seed-placeholder
      ORDER_SERVICE_CLIENT_SECRET: seed-placeholder
      VENDOR_SERVICE_CLIENT_SECRET: seed-placeholder
      DELIVERY_SERVICE_CLIENT_SECRET: seed-placeholder
      CATALOG_SERVICE_CLIENT_SECRET: seed-placeholder

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - citymarket
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    networks:
      - citymarket
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5673:5672"
      - "15673:15672"

  # ────────────────────────────────────────────
  #  Backend services
  # ────────────────────────────────────────────
  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/auth-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: auth_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      JWT_SERVICE_ACCESS_EXPIRY: ${JWT_SERVICE_ACCESS_EXPIRY:-15m}
      ADMIN_SERVICE_CLIENT_ID: admin-service-id
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET}
      ORDER_SERVICE_CLIENT_ID: order-service-id
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}
      DELIVERY_SERVICE_CLIENT_ID: delivery-service-id
      DELIVERY_SERVICE_CLIENT_SECRET: ${DELIVERY_SERVICE_CLIENT_SECRET}
      WEBSOCKET_GATEWAY_CLIENT_ID: websocket-gateway-id
      WEBSOCKET_GATEWAY_CLIENT_SECRET: ${WEBSOCKET_GATEWAY_CLIENT_SECRET}
      RATING_SERVICE_CLIENT_ID: rating-service-id
      RATING_SERVICE_CLIENT_SECRET: ${RATING_SERVICE_CLIENT_SECRET}
      PAYMENT_SERVICE_CLIENT_ID: payment-service-id
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET}
      CATALOG_SERVICE_CLIENT_ID: catalog-service-id
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET}
      NOTIFICATION_SERVICE_CLIENT_ID: notification-service-id
      NOTIFICATION_SERVICE_CLIENT_SECRET: ${NOTIFICATION_SERVICE_CLIENT_SECRET}
      VENDOR_SERVICE_CLIENT_ID: vendor-service-id
      VENDOR_SERVICE_CLIENT_SECRET: ${VENDOR_SERVICE_CLIENT_SECRET}

  user-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/user-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: user_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  vendor-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/vendor-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: vendor_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      VENDOR_SERVICE_CLIENT_ID: vendor-service-id
      VENDOR_SERVICE_CLIENT_SECRET: ${VENDOR_SERVICE_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  catalog-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/catalog-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: catalog_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      MEDIA_SERVICE_URL: http://media-service:3012
      VENDOR_SERVICE_URL: http://vendor-service:3003
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      CATALOG_SERVICE_CLIENT_ID: catalog-service-id
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET}

  order-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/order-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: order_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CATALOG_SERVICE_URL: http://catalog-service:3004
      VENDOR_SERVICE_URL: http://vendor-service:3003
      USER_SERVICE_URL: http://user-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      ORDER_SERVICE_CLIENT_ID: order-service-id
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}
      ORDER_CONFIRMATION_TIMEOUT_MINUTES: ${ORDER_CONFIRMATION_TIMEOUT_MINUTES:-2}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  delivery-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/delivery-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3006
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: delivery_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ORDER_SERVICE_URL: http://order-service:3005
      VENDOR_SERVICE_URL: http://vendor-service:3003
      USER_SERVICE_URL: http://user-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      DELIVERY_SERVICE_CLIENT_ID: delivery-service-id
      DELIVERY_SERVICE_CLIENT_SECRET: ${DELIVERY_SERVICE_CLIENT_SECRET}
      ASSIGNED_WINDOW_MINUTES: ${ASSIGNED_WINDOW_MINUTES:-2}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  admin-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/admin-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3007
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: admin_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ORDER_SERVICE_URL: http://order-service:3005
      VENDOR_SERVICE_URL: http://vendor-service:3003
      DELIVERY_SERVICE_URL: http://delivery-service:3006
      USER_SERVICE_URL: http://user-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3004
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      ADMIN_SERVICE_CLIENT_ID: admin-service-id
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}

  notification-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/notification-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3008
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: notification_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/run/secrets/firebase-service-account.json}
    secrets:
      - source: firebase-service-account
        target: /run/secrets/firebase-service-account.json

  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/payment-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3009
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: payment_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      PAYMENT_SERVICE_CLIENT_ID: payment-service-id
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}

  rating-service:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/rating-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3010
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-citymarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: rating_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ORDER_SERVICE_URL: http://order-service:3005
      USER_SERVICE_URL: http://user-service:3002
      VENDOR_SERVICE_URL: http://vendor-service:3003
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      RATING_SERVICE_CLIENT_ID: rating-service-id
      RATING_SERVICE_CLIENT_SECRET: ${RATING_SERVICE_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  websocket-gateway:
    <<: *rabbitmq-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/websocket-gateway
        SERVICE_MAIN: dist/index.js
    environment:
      PORT: 3011
      ORDER_SERVICE_URL: http://order-service:3005
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TOKEN_URL: http://auth-service:3001/oauth/token
      WEBSOCKET_GATEWAY_CLIENT_ID: websocket-gateway-id
      WEBSOCKET_GATEWAY_CLIENT_SECRET: ${WEBSOCKET_GATEWAY_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

  media-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/media-service
        SERVICE_MAIN: dist/server.js
    environment:
      PORT: 3012
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SERVICE_ACCESS_SECRET: ${JWT_SERVICE_ACCESS_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-citymarket-media}
      CDN_URL: ${CDN_URL:-https://pub-7511c1b2d5e34cdb8067140032d3eec0.r2.dev}

  # ────────────────────────────────────────────
  #  Nginx — API Gateway (replaces api-gateway service)
  # ────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        ENABLE_SSL: ${ENABLE_SSL:-false}
        DOMAIN: ${DOMAIN:-localhost}
    restart: unless-stopped
    networks:
      - citymarket
    depends_on:
      - auth-service
      - user-service
      - vendor-service
      - catalog-service
      - order-service
      - delivery-service
      - admin-service
      - notification-service
      - payment-service
      - rating-service
      - websocket-gateway
      - media-service
      - customer-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  # ────────────────────────────────────────────
  #  Web apps (each served by their own nginx)
  # ────────────────────────────────────────────
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        WEB_APP: admin-dashboard
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - citymarket
    ports:
      - "8080:80"

  vendor-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        WEB_APP: vendor-dashboard
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - citymarket
    ports:
      - "8083:80"

  delivery-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        WEB_APP: delivery-dashboard
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - citymarket
    ports:
      - "8082:80"

  customer-web:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        WEB_APP: customer
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - citymarket
    ports:
      - "8084:80"

# ────────────────────────────────────────────
#  Volumes & Networks
# ────────────────────────────────────────────
volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:

secrets:
  firebase-service-account:
    file: ${FIREBASE_CREDENTIALS_FILE:-./firebase-credentials.json}

networks:
  citymarket:
    driver: bridge

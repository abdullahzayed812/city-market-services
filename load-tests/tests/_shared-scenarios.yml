# The single source of truth for the realistic weighted traffic mix (Phase 8),
# shared by every tests/*.yml tier via Artillery's native multi-file merge:
#   artillery run -e <env> config/environments.yml tests/<tier>.yml tests/_shared-scenarios.yml
# (scripts/run-test.ts does this for you - see package.json's loadtest:* scripts).
#
# This file is the ONLY one in tests/ that defines a top-level `scenarios:` key.
# Artillery deep-merges multiple test files' `config:` blocks but concatenates
# `scenarios:` arrays index-by-index rather than appending them (verified
# empirically - two files each defining scenarios[0] silently corrupt each
# other's flow) - so every tier file must contribute phases/thresholds only,
# never its own scenarios list. Not meant to be run standalone (it has no
# `config.target`/`phases` of its own).
#
# Weights (out of 100): Customer 89% (Browse 37 / Search 18 / Vendor+Product 14 /
# Order 20 - there is no cart backend, see scenarios/customer-browse.yml),
# Vendor 7%, Delivery office 3%, Courier 1%.
#
# The delivery-office persona must keep pace with the deliveries the mix creates
# (every order a vendor CONFIRMs becomes a PENDING delivery), as real offices do.
# At 2% with one claim per session it claimed ~25 per baseline run against ~95
# created, so PENDING deliveries piled up across runs - and because
# GET /delivery/deliveries/pending is unpaginated and fans out 2 internal calls
# per row, that backlog alone exhausted MySQL connections. Each office session now
# claims up to 3 deliveries.
#
# Sessions: every persona LOGS IN as a pre-seeded account (POST /auth/login as a
# real, counted request) - nothing here registers new users. Registration has its
# own check in smoke.yml. Customer accounts are handed out in `sequence` order, so
# with a pool much larger than the concurrent-session count (scripts/seed.ts
# defaults to 300 customers vs ~50 concurrent sessions in baseline) two live VUs
# never share an account. Pools that are naturally small (20 vendors, 3 delivery
# managers, 10 couriers) see some reuse; that is safe because access tokens are
# stateless JWTs - a second login only revokes the first session's refresh token.
#
# Session length is roughly 10s of think time + request time per VU, so
# arrivalRate 5/s gives ~50 concurrent active sessions (Little's law). The report
# measures the real number - see scripts/report.ts.
#
# Prerequisite: `npm run loadtest:seed` (scripts/run-test.ts preflights the CSVs).
config:
  processor: "../processors/index.ts"
  payload:
    - path: "../data/generated/customers.csv"
      fields: ["customerEmail", "customerPassword", "customerUserId"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/vendor-products.csv"
      fields: ["poolVendorId", "poolVendorProductId", "poolMeasurementType"]
      order: "random"
      skipHeader: true
    - path: "../data/generated/vendors.csv"
      fields: ["vendorEmail", "vendorPassword", "vendorUserId", "vendorProfileId"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/delivery-managers.csv"
      fields: ["officeEmail", "officePassword"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/couriers.csv"
      fields: ["courierEmail", "courierPassword", "courierUserId", "poolCourierId", "courierOfficeEmail"]
      order: "sequence"
      skipHeader: true
  plugins:
    metrics-by-endpoint:
      useOnlyRequestNames: true

scenarios:
  - name: "Customer: Browse"
    weight: 37
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "customerLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - get:
          url: "/catalog/categories"
          name: "GET /catalog/categories"
          beforeRequest: "attachAuthHeader"
      - think: 2
      - get:
          url: "/vendors?page=1&limit=20"
          name: "GET /vendors"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data"
              as: "vendorsRaw"
              strict: false
      - think: 3
      - function: "pickRandomVendorId"
      - get:
          url: "/vendors/{{ vendorId }}"
          name: "GET /vendors/:id"
          beforeRequest: "attachAuthHeader"
          ifTrue: "vendorId"
      - think: 2
      - get:
          url: "/catalog/products/vendor/{{ vendorId }}?page=1&limit=20"
          name: "GET /catalog/products/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          ifTrue: "vendorId"
      - think: 4

  - name: "Customer: Search"
    weight: 18
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "customerLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - function: "pickSearchTerm"
      - get:
          url: "/catalog/products/search?search={{ searchTerm }}&page=1&limit=20"
          name: "GET /catalog/products/search"
          beforeRequest: "attachAuthHeader"
      - think: 3
      - get:
          url: "/catalog/categories"
          name: "GET /catalog/categories"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data"
              as: "categoriesRaw"
              strict: false
      - function: "pickRandomCategoryId"
      - think: 2
      - get:
          url: "/catalog/products/category/{{ categoryId }}?page=1&limit=20"
          name: "GET /catalog/products/category/:categoryId"
          beforeRequest: "attachAuthHeader"
          ifTrue: "categoryId"
      - think: 3

  - name: "Customer: Vendor + product detail"
    weight: 14
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "customerLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - get:
          url: "/vendors?page=1&limit=20"
          name: "GET /vendors"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data"
              as: "vendorsRaw"
              strict: false
      - function: "pickRandomVendorId"
      - think: 2
      - get:
          url: "/vendors/{{ vendorId }}"
          name: "GET /vendors/:id"
          beforeRequest: "attachAuthHeader"
          ifTrue: "vendorId"
      # The vendor profile carries no products - the product list comes from
      # catalog, which is what the product-detail pick below needs.
      - get:
          url: "/catalog/products/vendor/{{ vendorId }}?page=1&limit=20"
          name: "GET /catalog/products/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          ifTrue: "vendorId"
          capture:
            - json: "$.data.data"
              as: "browseResultsRaw"
              strict: false
      - think: 3
      - function: "pickRandomProduct"
      - get:
          url: "/catalog/products/{{ selectedProduct.id }}"
          name: "GET /catalog/products/:id"
          beforeRequest: "attachAuthHeader"
          ifTrue: "selectedProduct"
      - think: 5

  - name: "Customer: Place order"
    weight: 20
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "customerLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - get:
          url: "/catalog/products/vendor/{{ poolVendorId }}?page=1&limit=20"
          name: "GET /catalog/products/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data.data"
              as: "browseResultsRaw"
              strict: false
      - think: 5
      - function: "pickOrderableProduct"
      - post:
          url: "/orders"
          name: "POST /orders"
          ifTrue: "selectedProduct"
          beforeRequest:
            - "attachOrderPayload"
            - "attachAuthHeader"
          capture:
            - json: "$.data.order.id"
              as: "orderId"
              strict: false
      - think: 2
      - get:
          url: "/orders/customer-orders/{{ orderId }}"
          name: "GET /orders/customer-orders/:id"
          beforeRequest: "attachAuthHeader"
          ifTrue: "orderId"
      - think: 3

  - name: "Vendor: order management"
    weight: 7
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "vendorLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - get:
          url: "/orders/vendor/{{ vendorProfileId }}?page=1&limit=10"
          name: "GET /orders/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data"
              as: "vendorOrdersRaw"
              strict: false
      - function: "pickPendingVendorOrder"
      - think: 1
      - post:
          url: "/orders/vendor-orders/{{ vendorOrderId }}/accept"
          name: "POST /orders/vendor-orders/:id/accept"
          beforeRequest: "attachAuthHeader"
          ifTrue: "hasPendingVendorOrder"
      - think: 3
      - patch:
          url: "/orders/vendor-orders/{{ vendorOrderId }}/status"
          name: "PATCH /orders/vendor-orders/:id/status (CONFIRMED)"
          beforeRequest: "attachAuthHeader"
          ifTrue: "hasPendingVendorOrder"
          json:
            status: "CONFIRMED"
      - think: 2

  - name: "Delivery office: claim"
    weight: 3
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "officeLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - loop:
          - get:
              url: "/delivery/deliveries/pending"
              name: "GET /delivery/deliveries/pending"
              beforeRequest: "attachAuthHeader"
              capture:
                - json: "$.data"
                  as: "pendingDeliveriesRaw"
                  strict: false
          - function: "pickAnyPendingDelivery"
          - think: 2
          - patch:
              url: "/delivery/deliveries/{{ deliveryId }}/accept"
              name: "PATCH /delivery/deliveries/:id/accept"
              beforeRequest: "attachAuthHeader"
              ifTrue: "deliveryId"
        count: 3
      - think: 1
      - get:
          url: "/delivery/couriers/available"
          name: "GET /delivery/couriers/available"
          beforeRequest: "attachAuthHeader"
      - think: 3

  - name: "Courier: pickup"
    weight: 1
    flow:
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "courierLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
      - get:
          url: "/delivery/couriers/me"
          name: "GET /delivery/couriers/me"
          beforeRequest: "attachAuthHeader"
      - patch:
          url: "/delivery/couriers/{{ poolCourierId }}/availability"
          name: "PATCH /delivery/couriers/:id/availability"
          beforeRequest: "attachAuthHeader"
          json:
            isAvailable: true
      - think: 2
      - get:
          url: "/delivery/deliveries/my-deliveries?page=1&limit=10"
          name: "GET /delivery/deliveries/my-deliveries"
          beforeRequest: "attachAuthHeader"
          capture:
            - json: "$.data"
              as: "myDeliveriesRaw"
              strict: false
      - function: "pickAssignedDelivery"
      - think: 2
      - patch:
          url: "/delivery/deliveries/{{ myDeliveryId }}/status"
          name: "PATCH /delivery/deliveries/:id/status (PICKED_UP)"
          beforeRequest: "attachAuthHeader"
          ifTrue: "myDeliveryId"
          json:
            status: "PICKED_UP"
      - think: 5

# Baseline test (Phase 11): ~50 concurrent active sessions running the realistic
# weighted mix in tests/_shared-scenarios.yml, measuring latency percentiles,
# error rate and HTTP status distribution at a known, moderate load.
#   npm run loadtest:baseline
#   npm run loadtest:baseline -- --phases '[{"duration":600,"arrivalRate":10}]'
#
# "arrivalRate" is new sessions/sec, not concurrent users. A mix session lasts
# ~10s (think time + requests), so 5 arrivals/s holds ~50 sessions in flight
# (Little's law: 5/s x 10s). The generated report measures the actual concurrency
# from Artillery's 10s snapshots and flags the run as invalid if it drifts more
# than 20% from the intended 50 - see scripts/report.ts.
#
# Only the steady phase counts toward that concurrency check; the short ramp lets
# connection pools and JIT warm up instead of hitting a cold stack with full load.
config:
  phases:
    - duration: 30
      arrivalRate: 1
      rampTo: 5
      name: "warm-up"
    - duration: 300
      arrivalRate: 5
      name: "steady ~50 concurrent sessions"
  plugins:
    ensure:
      # General read-API SLO (Phase 20). The mix is read-dominated, so the
      # aggregate is gated on the read target; per-endpoint latency is in the
      # generated report. maxErrorRate here is Artillery's VU-failure rate - the
      # report additionally gates on the HTTP-level error rate.
      thresholds:
        - "http.response_time.p95": 500
        - "http.response_time.p99": 1000
      maxErrorRate: 1

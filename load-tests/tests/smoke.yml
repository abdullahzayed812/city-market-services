# Smoke test (Phase 10): verifies the target is reachable, auth works, seed data
# exists, and every persona's main flow responds - a fast go/no-go check before
# baseline. NOT the realistic weighted mix (see baseline.yml onward for that).
#
# One scenario walks every persona in sequence so each run is guaranteed to cover
# all of them (a weighted mix at 8 VUs can randomly skip one): register a new
# customer (the only place registration runs in the standard tiers), log in as a
# pre-seeded customer, browse and place a real order, then log in as a vendor, a
# delivery manager and a courier and read their dashboards.
#
# Uses arrivalCount (a fixed total, not a rate): arrivalRate is PER SECOND, and
# an earlier arrivalRate:5 for 60s here generated ~300 VUs.
#
#   npm run loadtest:smoke                    (local, default phases below)
#   npm run loadtest:smoke -- --env local-nginx
#
# Prerequisite: `npm run loadtest:seed`.
config:
  processor: "../processors/index.ts"
  phases:
    - duration: 60
      arrivalCount: 8
      name: "smoke"
  payload:
    - path: "../data/generated/customers.csv"
      fields: ["customerEmail", "customerPassword", "customerUserId"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/vendor-products.csv"
      fields: ["poolVendorId", "poolVendorProductId", "poolMeasurementType"]
      order: "random"
      skipHeader: true
    - path: "../data/generated/vendors.csv"
      fields: ["vendorEmail", "vendorPassword", "vendorUserId", "vendorProfileId"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/delivery-managers.csv"
      fields: ["officeEmail", "officePassword"]
      order: "sequence"
      skipHeader: true
    - path: "../data/generated/couriers.csv"
      fields: ["courierEmail", "courierPassword", "courierUserId", "poolCourierId", "courierOfficeEmail"]
      order: "sequence"
      skipHeader: true
  plugins:
    expect:
      reportFailuresAsErrors: true
      useOnlyRequestNames: true
    metrics-by-endpoint:
      useOnlyRequestNames: true
    ensure:
      thresholds:
        - "http.response_time.p95": 1000
      maxErrorRate: 5

scenarios:
  - name: "Smoke: all personas"
    flow:
      # Registration (new account) - checked here only.
      - post:
          url: "/auth/register"
          name: "POST /auth/register"
          beforeRequest: "customerRegisterBody"
          expect:
            - statusCode: 201

      # Customer: pre-seeded account, browse, order.
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "customerLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
          expect:
            - statusCode: 200
      - get:
          url: "/catalog/categories"
          name: "GET /catalog/categories"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200
      - get:
          url: "/catalog/products/vendor/{{ poolVendorId }}?page=1&limit=20"
          name: "GET /catalog/products/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200
          capture:
            - json: "$.data.data"
              as: "browseResultsRaw"
              strict: false
      - function: "pickOrderableProduct"
      - post:
          url: "/orders"
          name: "POST /orders"
          ifTrue: "selectedProduct"
          beforeRequest:
            - "attachOrderPayload"
            - "attachAuthHeader"
          expect:
            - statusCode: 201

      # Vendor dashboard.
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "vendorLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
          expect:
            - statusCode: 200
      - get:
          url: "/vendors/me"
          name: "GET /vendors/me"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200
      - get:
          url: "/orders/vendor/{{ vendorProfileId }}?page=1&limit=5"
          name: "GET /orders/vendor/:vendorId"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200

      # Delivery office dashboard.
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "officeLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
          expect:
            - statusCode: 200
      - get:
          url: "/delivery/deliveries/pending"
          name: "GET /delivery/deliveries/pending"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200

      # Courier app.
      - post:
          url: "/auth/login"
          name: "POST /auth/login"
          beforeRequest: "courierLoginBody"
          capture:
            - json: "$.data.accessToken"
              as: "accessToken"
          expect:
            - statusCode: 200
      - get:
          url: "/delivery/couriers/me"
          name: "GET /delivery/couriers/me"
          beforeRequest: "attachAuthHeader"
          expect:
            - statusCode: 200

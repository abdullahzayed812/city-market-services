# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=ws:10m      rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── WebSocket (Socket.IO) ──────────────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=ws burst=30 nodelay;
        proxy_pass         http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── Auth (stricter rate limit) ────────────────────────────────────────────
    location /api/v1/auth {
        limit_req zone=auth burst=20 nodelay;
        rewrite ^/api/v1/auth/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
    }

    # ── REST API routes ────────────────────────────────────────────────────────
    location /api/v1/users {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/users/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
    }

    location /api/v1/vendors {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/vendors/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3003;
    }

    location /api/v1/catalog {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/catalog/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3004;
    }

    location /api/v1/orders {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/orders/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3005;
    }

    location /api/v1/delivery {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/delivery/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3006;
    }

    location /api/v1/admin {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/admin/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3007;
    }

    location /api/v1/notification {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/notification/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3008;
    }

    location /api/v1/payments {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/v1/payments/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3009;
    }

    location /api/v1/ratings {
        limit_req zone=api burst=30 nodelay;
        rewrite ^/api/v1/ratings/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3010;
    }

    location /api/v1/media/ {
        limit_req zone=api burst=10 nodelay;
        rewrite ^/api/v1/media/(.*)$ /media/$1 break;
        proxy_pass         http://127.0.0.1:3012;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # # ── Customer web (Vite dev server on port 5173) ───────────────────────────
    # location / {

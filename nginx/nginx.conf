# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=ws:10m      rate=5r/m;
limit_req_status 429;

# ── Gzip ──────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — resolves service names lazily (not at startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── WebSocket (Socket.IO) ──────────────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=ws burst=10 nodelay;
        set $ws_upstream http://websocket-gateway:3011;
        proxy_pass         $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── Auth (stricter rate limit) ────────────────────────────────────────────
    location /api/v1/auth {
        limit_req zone=auth burst=20 nodelay;
        set $upstream http://auth-service:3001;
        rewrite ^/api/v1/auth/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # ── REST API routes ────────────────────────────────────────────────────────
    location /api/v1/users {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://user-service:3002;
        rewrite ^/api/v1/users/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/vendors {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://vendor-service:3003;
        rewrite ^/api/v1/vendors/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/catalog {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://catalog-service:3004;
        rewrite ^/api/v1/catalog/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/orders {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://order-service:3005;
        rewrite ^/api/v1/orders/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/delivery {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://delivery-service:3006;
        rewrite ^/api/v1/delivery/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/admin {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://admin-service:3007;
        rewrite ^/api/v1/admin/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/notification {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://notification-service:3008;
        rewrite ^/api/v1/notification/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/payments {
        limit_req zone=api burst=20 nodelay;
        set $upstream http://payment-service:3009;
        rewrite ^/api/v1/payments/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/ratings {
        limit_req zone=api burst=30 nodelay;
        set $upstream http://rating-service:3010;
        rewrite ^/api/v1/ratings/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/media/ {
        limit_req zone=api burst=10 nodelay;
        set $upstream http://media-service:3012;
        rewrite ^/api/v1/media/(.*)$ /media/$1 break;
        proxy_pass         $upstream;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404 '{"success":false,"message":"route_not_found"}';
        add_header Content-Type application/json;
    }
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — resolves service names lazily (not at startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── WebSocket (Socket.IO) ──────────────────────────────────────────────
    location /socket.io/ {
        set $ws_upstream http://websocket-gateway:3011;
        proxy_pass         $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── REST API routes ────────────────────────────────────────────────────
    location /api/v1/auth/ {
        set $upstream http://auth-service:3001;
        rewrite ^/api/v1/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/users/ {
        set $upstream http://user-service:3002;
        rewrite ^/api/v1/users/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/vendors/ {
        set $upstream http://vendor-service:3003;
        rewrite ^/api/v1/vendors/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/catalog/ {
        set $upstream http://catalog-service:3004;
        rewrite ^/api/v1/catalog/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/orders/ {
        set $upstream http://order-service:3005;
        rewrite ^/api/v1/orders/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/delivery/ {
        set $upstream http://delivery-service:3006;
        rewrite ^/api/v1/delivery/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/admin/ {
        set $upstream http://admin-service:3007;
        rewrite ^/api/v1/admin/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/notification/ {
        set $upstream http://notification-service:3008;
        rewrite ^/api/v1/notification/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/payments/ {
        set $upstream http://payment-service:3009;
        rewrite ^/api/v1/payments/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/v1/ratings/ {
        set $upstream http://rating-service:3010;
        rewrite ^/api/v1/ratings/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /health {
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404 '{"success":false,"message":"route_not_found"}';
        add_header Content-Type application/json;
    }
}
